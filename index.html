<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verdane - Modular Game Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    #ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      pointer-events: none;
      z-index: 10;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    #ui div { margin: 4px 0; }
    .debug-info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: #888;
      font-family: monospace;
      font-size: 11px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="1920" height="1080"></canvas>
  <div id="ui">
    <div>Score: <span id="ui-score">0</span></div>
    <div>Wave: <span id="ui-wave">1</span> / <span id="ui-max-wave">5</span></div>
    <div>Enemies: <span id="ui-enemies">0</span></div>
    <div>Vases: <span id="ui-vases">0</span></div>
  </div>
  <div class="debug-info">
    <div id="debug-fps">FPS: --</div>
    <div id="debug-pos">Pos: (0, 0)</div>
  </div>
  <script type="module" src="./js/game.js"></script>
</body>
</html>
